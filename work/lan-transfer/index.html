<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>局域网快传</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    html.lan-auth-pending body {
      visibility: hidden;
    }
  </style>
  <script>
    document.documentElement.classList.add('lan-auth-pending');
  </script>
  <script src="./auth-config.js?v=20260719-auth-2"></script>
  <script src="./lan-transfer-auth.js?v=20260719-auth-1"></script>
  <link rel="stylesheet" href="../tools/shared/tools.css" />
  <link rel="stylesheet" href="./lan-transfer.css?v=20260720-ui-2" />
  <script src="./vendor/lz-string.min.js?v=20260719-auth-1" defer></script>
  <script src="./vendor/qrcode.js?v=20260719-auth-1" defer></script>
  <script src="./vendor/jszip.min.js?v=20260719-auth-1" defer></script>
</head>
<body>
  <main class="tool-shell lan-shell">
    <nav class="tool-topbar" aria-label="局域网快传导航">
      <a class="tool-back" href="../tools/">返回工具中心</a>
      <a class="tool-back" href="../../index.html#work">返回作品区</a>
    </nav>

    <header>
      <h1 class="tool-title">局域网快传</h1>
      <p class="tool-subtitle">在同一局域网或可直连的设备之间快速传文件。文件通过浏览器点对点传输，不经过本站服务器。</p>
    </header>

    <section class="tool-panel lan-mode-panel" aria-label="选择模式">
      <button class="tool-button primary lan-mode-button" type="button" data-mode="send" aria-controls="send-panel" aria-pressed="true">发送文件</button>
      <button class="tool-button lan-mode-button" type="button" data-mode="receive" aria-controls="receive-panel" aria-pressed="false">接收文件</button>
    </section>

    <section class="tool-panel tool-stack" aria-label="设备设置">
      <div class="tool-form-grid">
        <label class="tool-field">
          <span>我的设备昵称</span>
          <input id="device-name" class="tool-input" type="text" maxlength="24" />
        </label>
        <label class="tool-check lan-advanced-toggle">
          <input id="use-public-stun" class="tool-input" type="checkbox" />
          <span>高级设置：增强连接成功率</span>
        </label>
      </div>
      <p id="connection-hint" class="tool-status">默认只使用局域网直连；连接失败时可开启增强连接成功率。</p>
    </section>

    <details class="tool-panel tool-stack lan-network-details" aria-label="网络信息">
      <summary>网络信息</summary>
      <div id="network-info" class="lan-info-grid"></div>
      <div id="signaling-status" class="tool-status" role="status" aria-live="polite"></div>
    </details>

    <section class="lan-steps" aria-label="连接步骤">
      <div class="lan-step is-active" data-step="1">1. 选择模式</div>
      <div class="lan-step" data-step="2">2. 交换短码</div>
      <div class="lan-step" data-step="3">3. 建立连接</div>
      <div class="lan-step" data-step="4">4. 传输与下载</div>
    </section>

    <section class="lan-workspace">
      <section id="send-panel" class="tool-panel tool-stack" data-panel="send">
        <h2>发送文件</h2>
        <label id="drop-zone" class="tool-upload lan-drop-zone">
          <input id="file-input" class="tool-file" type="file" multiple />
          <span class="tool-upload-button">选择文件</span>
          <span id="file-input-name" class="tool-upload-name">未选择文件；也可以拖拽文件到这里，或按 Ctrl/Command+V 粘贴</span>
        </label>
        <div id="file-pick-status" class="tool-status" role="status" aria-live="polite"></div>
        <div class="tool-actions">
          <button id="create-offer" class="tool-button primary" type="button">生成发起码</button>
          <button id="import-answer" class="tool-button" type="button">导入回应码</button>
          <button id="send-files" class="tool-button primary" type="button" disabled>开始发送</button>
        </div>
      </section>

      <section id="receive-panel" class="tool-panel tool-stack" data-panel="receive" hidden>
        <h2>接收文件</h2>
        <label class="tool-field">
          <span>输入短码</span>
          <input id="short-code-input" class="tool-input lan-short-code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="输入 4 位数字" />
        </label>
        <div class="tool-actions">
          <button id="connect-short-code" class="tool-button primary" type="button">连接发送端</button>
          <button id="scan-qr" class="tool-button" type="button">扫描二维码</button>
          <button id="import-offer" class="tool-button" type="button">高级导入</button>
        </div>
        <div id="receive-status" class="tool-status" role="status" aria-live="polite"></div>
        <div id="scanner" class="lan-scanner" hidden>
          <video id="scanner-video" playsinline muted></video>
          <div id="scanner-status" class="tool-status" role="status" aria-live="polite"></div>
        </div>
      </section>
    </section>

    <section id="signal-panel" class="tool-panel tool-stack" aria-label="发起码">
      <h2>发起码</h2>
      <div id="short-code-wrap" class="lan-short-code-wrap" hidden>
        <span class="lan-short-code-label">给接收方输入</span>
        <strong id="short-code" class="lan-short-code">----</strong>
      </div>
      <div class="lan-code-grid">
        <div class="lan-qr-box"><canvas id="signal-qr" width="240" height="240" aria-label="连接码二维码"></canvas></div>
        <details id="manual-code-details" class="lan-manual-code" open>
          <summary>高级：手动连接码</summary>
          <textarea id="signal-code" class="tool-textarea lan-code-textarea" spellcheck="false"></textarea>
        </details>
      </div>
      <div class="tool-actions">
        <button id="copy-code" class="tool-button" type="button">复制发起码</button>
        <button id="paste-code" class="tool-button" type="button">从剪贴板读取</button>
        <button id="reset-session" class="tool-button" type="button">重新生成连接</button>
      </div>
      <div id="signal-status" class="tool-status" role="status" aria-live="polite"></div>
    </section>

    <section class="tool-panel tool-stack" aria-label="文件与传输">
      <h2>文件列表</h2>
      <div id="file-list" class="lan-file-list"></div>
      <progress id="transfer-progress" class="lan-progress" value="0" max="100" aria-label="传输进度" aria-describedby="transfer-status"></progress>
      <div id="transfer-status" class="tool-status" role="status" aria-live="polite"></div>
      <div class="tool-actions">
        <button id="download-all" class="tool-button primary" type="button" disabled>下载全部文件</button>
        <button id="download-zip" class="tool-button primary" type="button" disabled>下载 ZIP</button>
        <button id="clear-transfer" class="tool-button" type="button">清空本次传输</button>
      </div>
    </section>

    <section class="tool-panel tool-stack" aria-label="文件预览">
      <h2>预览</h2>
      <div id="preview-list" class="lan-preview-list"></div>
    </section>
  </main>

  <script type="module" src="./lan-transfer.js?v=20260719-ui-1"></script>
  <script type="module" src="/assets/js/site-cli-sidebar.js"></script>
</body>
</html>
