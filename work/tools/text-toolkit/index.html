<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文本工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/tools.css" />
</head>
<body>
  <main class="tool-shell">
    <nav class="tool-topbar" aria-label="文本工具箱导航">
      <a class="tool-back" href="../">返回工具中心</a>
      <a class="tool-back" href="../../../index.html#work">返回作品区</a>
    </nav>

    <header>
      <h1 class="tool-title">文本工具箱</h1>
      <p class="tool-subtitle">在浏览器里清理、转换、编码、解码和格式化文本。</p>
    </header>

    <section class="tool-grid" aria-label="文本编辑器">
      <label class="tool-field">
        <span>输入</span>
        <textarea id="input" class="tool-textarea" spellcheck="false">{"诗句":"海上生明月，天涯共此时。","作者":"张九龄"}</textarea>
      </label>
      <label class="tool-field">
        <span>输出</span>
        <textarea id="output" class="tool-textarea" spellcheck="false" readonly></textarea>
      </label>
    </section>

    <section class="tool-panel tool-stack" aria-label="文本操作">
      <div class="tool-actions">
        <button class="tool-button primary" data-action="json-format">格式化结构化文本</button>
        <button class="tool-button" data-action="json-minify">压缩结构化文本</button>
        <button class="tool-button" data-action="dedupe">去除重复行</button>
        <button class="tool-button" data-action="remove-empty">删除空行</button>
        <button class="tool-button" data-action="trim-lines">修剪行首尾空格</button>
        <button class="tool-button" data-action="sort-asc">升序排序</button>
        <button class="tool-button" data-action="sort-desc">降序排序</button>
        <button class="tool-button" data-action="line-numbers">添加行号</button>
        <button class="tool-button" data-action="upper">转大写</button>
        <button class="tool-button" data-action="lower">转小写</button>
        <button class="tool-button" data-action="title">转标题格式</button>
        <button class="tool-button" data-action="base64-encode">编码为 Base64</button>
        <button class="tool-button" data-action="base64-decode">解码 Base64</button>
        <button class="tool-button" data-action="url-encode">编码链接文本</button>
        <button class="tool-button" data-action="url-decode">解码链接文本</button>
      </div>
      <div class="tool-actions">
        <button id="copy-output" class="tool-button">复制输出</button>
        <button id="swap-text" class="tool-button">交换输入输出</button>
        <button id="download-output" class="tool-button">下载输出</button>
        <button id="clear-text" class="tool-button">清空</button>
      </div>
      <div id="stats" class="tool-status" role="status" aria-live="polite"></div>
      <div id="status" class="tool-status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="./text-toolkit.js"></script>
</body>
</html>
