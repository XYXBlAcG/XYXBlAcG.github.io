<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site CLI</title>
  <link rel="icon" href="/favico.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.6.2/core.css" />
  <link rel="stylesheet" href="./cli.css" />
  <script type="module" src="https://pyscript.net/releases/2024.6.2/core.js"></script>
  <script type="py" src="./cli-python.py"></script>
  <script type="module" src="./cli.js"></script>
</head>
<body>
  <main class="cli-screen" data-theme-strength="normal">
    <header class="cli-titlebar" aria-label="CLI 状态栏">
      <a class="cli-brand" href="/" aria-label="返回首页">XYX:/cli</a>
      <div class="cli-status">
        <span id="cli-python-status" class="cli-dot" data-state="pending">Python 待启用</span>
        <span id="cli-clock">--:--:--</span>
      </div>
    </header>

    <section class="cli-terminal" aria-label="网站命令行界面">
      <div id="cli-output" class="cli-output" aria-live="polite"></div>
      <form id="cli-form" class="cli-prompt" autocomplete="off">
        <label class="cli-prompt-label" for="cli-input">xyx@site</label>
        <span class="cli-path">/cli</span>
        <span class="cli-symbol">$</span>
        <input id="cli-input" type="text" spellcheck="false" autofocus aria-label="命令输入" aria-describedby="cli-help-line" aria-controls="cli-autocomplete" aria-expanded="false" aria-autocomplete="list" />
        <button type="submit" class="cli-run-button">运行</button>
      </form>
      <div id="cli-autocomplete" class="cli-autocomplete" role="listbox" aria-label="命令补全"></div>
      <p id="cli-help-line" class="cli-help-line">输入 help 查看命令；Tab 补全；↑ ↓ 浏览历史；Ctrl+L 清屏。</p>
    </section>
  </main>
</body>
</html>
